name: Mission CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - run: node --check docs/app.js && node --check docs/github-api.mjs && node --check docs/analytics.mjs && node --check docs/analytics-view.mjs
      - name: Browser responsive smoke (synthetic GitHub fixture)
        run: node tests/browser-smoke.mjs
      - name: Upload browser QA screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mission-neo-brutalism-browser-qa
          path: qa-screenshots/
          retention-days: 7
