name: Test and deploy Mission to aaPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund; fi
      - run: npm test
      - run: node --check docs/app.js && bash -n deploy/setup-aapanel.sh && bash -n deploy/mission-deploy.sh

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AAPANEL_PANEL_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mission-production
      cancel-in-progress: false
    steps:
      - name: Validate webhook configuration
        env:
          PANEL_URL: ${{ vars.AAPANEL_PANEL_URL }}
          WEBHOOK_KEY: ${{ secrets.AAPANEL_WEBHOOK_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = os.environ["PANEL_URL"]
          parts = urlsplit(url)
          assert parts.scheme == "https" and parts.hostname and not parts.username and not parts.password
          assert not parts.path and not parts.query and not parts.fragment
          assert not any(c.isspace() for c in url)
          assert os.environ["WEBHOOK_KEY"].strip(), "Missing AAPANEL_WEBHOOK_KEY"
          PY
      - name: Trigger aaPanel webhook
        # aaPanel Auto Deploy v4. Pin the reviewed upstream commit.
        uses: tunnaduong/aapanel-deploy-action@97d3df96ab171c9eaedb91f76664f0a478c1a790
        with:
          panel_url: ${{ vars.AAPANEL_PANEL_URL }}
          webhook_key: ${{ secrets.AAPANEL_WEBHOOK_KEY }}
        env:
          # needs: test is the CI gate; no extra GitHub token needed.
          GITHUB_TOKEN: ''
      - name: Verify deployed revision (optional public HTTPS health endpoint)
        if: vars.MISSION_URL != ''
        env:
          MISSION_URL: ${{ vars.MISSION_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MISSION_URL" == https://* && "$MISSION_URL" != */ ]]
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 "$MISSION_URL/healthz" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .revision == $sha' >/dev/null; then
              echo "Verified deployed revision $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Webhook was triggered but the expected revision could not be verified. Check aaPanel webhook output, service logs, and whether main advanced."
          exit 1
